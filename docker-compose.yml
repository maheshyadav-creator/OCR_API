services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  db:
    image: postgres:18
    container_name: ocr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # RabbitMQ - Celery Broker
  # ==========================================================

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ocr_rabbitmq
    restart: unless-stopped

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}

    ports:
      # AMQP - Celery communication
      - "5672:5672"

      # RabbitMQ Management UI
      - "15672:15672"

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    healthcheck:
      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # FastAPI
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ocr_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # PostgreSQL
      DB_HOST: db
      DB_PORT: 5432

      # Celery / RabbitMQ
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//

    ports:
      - "8000:8000"

    volumes:
      # Uploaded PDFs are temporarily stored here.
      # The API and Celery worker share this volume.
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy


  # ==========================================================
  # Celery OCR Worker
  # ==========================================================
  #
  # IMPORTANT:
  #
  # One container
  # One Celery worker process
  # One OCR job at a time
  #
  # This keeps PaddleOCR RAM usage under control.
  #
  # Celery message contains only job_id.
  # PDF remains on the shared ocr_storage volume.
  #
  # ==========================================================

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ocr_celery_worker
    restart: unless-stopped

    env_file:
      - .env

    environment:
      # PostgreSQL
      DB_HOST: db
      DB_PORT: 5432

      # Celery / RabbitMQ
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672//

    volumes:
      # Same volume used by FastAPI.
      #
      # API:
      #   /app/storage/jobs/<job_id>.pdf
      #
      # Worker:
      #   reads the same file
      #   runs OCR
      #   deletes it after completion/final failure
      #
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

    command:
      [
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=1",
        "--prefetch-multiplier=1"
      ]


# ============================================================
# Docker Volumes
# ============================================================

volumes:

  # PostgreSQL persistent database storage
  postgres_data:

  # Temporary OCR files
  ocr_storage:

  # RabbitMQ persistent broker state
  rabbitmq_data: