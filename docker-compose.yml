services:

  # ==========================================================
  # PostgreSQL
  # ==========================================================

  db:
    image: postgres:18
    container_name: ocr_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_NAME}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # Redis
  # ==========================================================

  redis:
    image: redis:7-alpine
    container_name: ocr_redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # FastAPI
  # ==========================================================

  api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ocr_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    ports:
      - "8000:8000"

    volumes:
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


  # ==========================================================
  # Production Worker 1
  # ==========================================================

  ocr_worker_1:
    image: ocr_api-api:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "app.worker.ocr_worker"
      ]


  # ==========================================================
  # Production Worker 2
  # ==========================================================

  ocr_worker_2:
    image: ocr_api-api:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "app.worker.ocr_worker"
      ]


  # ==========================================================
  # Production Worker 3
  # ==========================================================

  ocr_worker_3:
    image: ocr_api-api:latest
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      [
        "python",
        "-m",
        "app.worker.ocr_worker"
      ]


  # ==========================================================
  # Cron / Recovery
  # ==========================================================

  cron:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ocr_cron
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: db
      DB_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ocr_storage:/app/storage

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - sh
      - -c
      - |
        env | grep -E '^(DB_|REDIS_)' | sed 's/^/export /' > /etc/ocr-cron.env
        chmod 600 /etc/ocr-cron.env
        exec cron -f


# ============================================================
# Docker Volumes
# ============================================================

volumes:

  postgres_data:

  ocr_storage: